[package]
name = "molt"
version = "0.1.0"
edition = "2021"
description = "Model Once, Load Trivially - Build-time toolkit for multi-language model packages"
license = "Apache-2.0"
repository = "https://github.com/freol35241/molt"
keywords = ["wasm", "codegen", "models", "python", "bindings"]
categories = ["development-tools", "compilers", "wasm"]

[dependencies]
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
wit-parser = "0.219"
anyhow = "1"
base64 = "0.22"
thiserror = "1"
heck = "0.5"
dirs = "5"

[dev-dependencies]
tempfile = "3"
